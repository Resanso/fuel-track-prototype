<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Car body -->
  <rect x="10" y="4" width="20" height="32" rx="6" ry="6" fill="#6366f1"/>
  <!-- Windshield front -->
  <rect x="13" y="7" width="14" height="8" rx="3" ry="3" fill="#a5b4fc" opacity="0.8"/>
  <!-- Windshield back -->
  <rect x="13" y="25" width="14" height="6" rx="2" ry="2" fill="#a5b4fc" opacity="0.6"/>
  <!-- Left wheels -->
  <rect x="7" y="10" width="4" height="7" rx="2" ry="2" fill="#312e81"/>
  <rect x="7" y="24" width="4" height="7" rx="2" ry="2" fill="#312e81"/>
  <!-- Right wheels -->
  <rect x="29" y="10" width="4" height="7" rx="2" ry="2" fill="#312e81"/>
  <rect x="29" y="24" width="4" height="7" rx="2" ry="2" fill="#312e81"/>
  <!-- Center line (hood detail) -->
  <line x1="20" y1="16" x2="20" y2="24" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Headlights -->
  <circle cx="14" cy="5.5" r="1.5" fill="#fbbf24"/>
  <circle cx="26" cy="5.5" r="1.5" fill="#fbbf24"/>
</svg>
